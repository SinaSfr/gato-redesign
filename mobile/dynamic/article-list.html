<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0,shrink-to-fit=no,viewport-fit=cover">
    <!-- Title & Description -->
    <title>[##cms.seo.title|(خرید بلیط هواپیما - رزرو تور داخلی و خارجی - گاتو (گردشگران خورشید سپاهان))##]
    </title>
    <meta name="description"
        content="[##cms.seo.description|(خرید بلیط هواپیما، تورهای داخلی و خارجی، رزرو پرواز و هتل با بهترین قیمت در گاتو (گردشگران خورشید سپاهان). سفر آسان، امن و مقرون‌به‌صرفه با پشتیبانی ۲۴ ساعته.)##]">
    <!-- Title & Description -->
    <basis core="dbsource" source="hosting" name="tag" urlid="[##cms.seo.urlid##]">
        <member type="list" name="list" request="taglist" preview=""></member>
    </basis>
    <basis core="print" datamembername="tag.list">
        <face filter="key = 'canonical'">
            <link rel="canonical" href="@value" />
        </face>
        <face>
            <meta property="@key" content="@value" />
        </face>
    </basis>
    <!-- pwa metatags -->
    <basis core="call" file="pwa.inc" pageindex="[##cms.cms.pageindex##]" />
    <!-- common styles for all page -->
    <basis core="call" file="style.inc" pageindex="[##cms.cms.pageindex##]" />
</head>

<body>
    <basis core="call" file="header.inc" pageindex="[##cms.cms.pageindex##]" />
    <main>
        <section class="relative bg-articleList bg-cover bg-center h-80"></section>
        <div class="flex items-center gap-2 mx-auto max-lg:w-[90%] mt-6">
            <svg width="24" height="24">
                <use href="/images/sprite-icons-mobile.svg#icon-home"></use>
            </svg>
            <ul itemscope itemtype="https://schema.org/BreadcrumbList"
                class="flex flex-wrap items-center text-sm gap-1">
                <li class="inline-block font-normal" itemprop="itemListElement" itemscope
                    itemtype="https://schema.org/ListItem">
                    <a class="flex items-center text-zinc-900 text-sm transition-all duration-300 hover:text-primary-800"
                        itemprop="item" href="/" aria-label="home">
                        <span itemprop="name">صفحه اصلی</span>
                        <meta itemprop="position" content="1" />
                    </a>
                </li>
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M15 6L9 12L15 18" stroke="#18181b " stroke-width="2"></path>
                </svg>
                <basis core="print" datamembername="db.navigation">
                    <face filter="RowNumber=max(RowNumber) and title <> 'ریشه'">
                        <li class="inline-block font-normal text-primary-800" itemprop="itemListElement" itemscope
                            itemtype="https://schema.org/ListItem">
                            <span itemprop="name">@title</span>
                            <meta itemprop="position" content="@rownumber" />
                        </li>
                    </face>
                    <face filter="link is null and title <> 'ریشه'">
                        <li class="flex gap-1 font-normal" itemprop="itemListElement" itemscope
                            itemtype="https://schema.org/ListItem">
                            <a class="flex items-center text-zinc-900 text-sm transition-all duration-300 hover:text-primary-800"
                                itemprop="item" href="/article-list.bc?catid=@parentcatid" aria-label="@title">
                                <span itemprop="name">@title</span>
                                <meta itemprop="position" content="@rownumber" />
                            </a>
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none"
                                xmlns="http://www.w3.org/2000/svg">
                                <path d="M15 6L9 12L15 18" stroke="#18181b " stroke-width="2"></path>
                            </svg>
                        </li>
                    </face>
                    <face filter="title <> 'ریشه'">
                        <li class="flex gap-1 font-normal" itemprop="itemListElement" itemscope
                            itemtype="https://schema.org/ListItem">
                            <a class="flex items-center text-zinc-900 text-sm transition-all duration-300 hover:text-primary-800"
                                itemprop="item" href="/@link" aria-label="@title">
                                <span
                                    class="flex items-center text-zinc-900 text-sm transition-all duration-300 hover:text-primary-800"
                                    itemprop="name">
                                    @title
                                </span>
                                <meta itemprop="position" content="@rownumber" />
                            </a>
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none"
                                xmlns="http://www.w3.org/2000/svg">
                                <path d="M15 6L9 12L15 18" stroke="#18181b" stroke-width="2"></path>
                            </svg>
                        </li>
                    </face>
                </basis>
            </ul>
        </div>
        <section class="mx-auto max-lg:w-[90%] mt-6">
            <basis core="list" datamembername="db.cat-description">
                <face>
                    <h1 class="text-2xl font-bold text-zinc-900">@title</h1>
                    <div class="text-sm text-zinc-900 mb-6">@urldescription
                    </div>
                </face>
            </basis>
            <basis core="list" datamembername="db.article-list">
                <layout>
                    <div class="flex flex-col gap-6">
                        @child
                    </div>
                </layout>
                <face filter="[00240X00224prp] is null">
                    <a href="/@link"
                        class="flex flex-col gap-2 border border-solid border-zinc-400 rounded-3xl p-6 shadow-tour-card">
                        <img src="[##cms.cms.cdn##]/images/no-image-placeholder.jpg" class="w-full h-56 object-cover rounded-3xl" alt="@title"
                            width="240" height="224" loading="lazy">
                        <h2 class="text-2xl font-bold text-zinc-900 line-clamp-1">@title</h2>
                        <div class="text-sm text-zinc-900 text-justify leading-6 line-clamp-4">@prp_7244</div>
                        <span class="text-xl font-medium text-zinc-900 text-end">@prp_7249</span>
                        <button
                            class="w-full h-12 flex items-center justify-center text-sm text-white bg-primary-800 rounded-lg mt-3">بیشتر
                            بخوانید</button>
                    </a>
                </face>
                <face>
                    <a href="/@link"
                        class="flex flex-col gap-2 border border-solid border-zinc-400 rounded-3xl p-6 shadow-tour-card">
                        <img src="[##cms.cms.cdn##]/@00240X00224prp" class="w-full h-56 object-cover rounded-3xl" alt="@title"
                            width="240" height="224" loading="lazy">
                        <h2 class="text-2xl font-bold text-zinc-900 line-clamp-1">@title</h2>
                        <div class="text-sm text-zinc-900 text-justify leading-6 line-clamp-4">@prp_7244</div>
                        <span class="text-xl font-medium text-zinc-900 text-end">@prp_7249</span>
                        <button
                            class="w-full h-12 flex items-center justify-center text-sm text-white bg-primary-800 rounded-lg mt-3">بیشتر
                            بخوانید</button>
                    </a>
                </face>
            </basis>

            <div id="paging" class="flex items-center justify-center mt-6">
                <ul class="flex items-center gap-3 cd-pagination no-space direction-ltr" id="wibpaging">
                    <basis core="print" datamembername="db.paging">
                        <face filter="(@sta='pre')and('[##cms.cms.pageurl##]'='')">
                            <li
                                class="group flex items-center justify-center w-12 h-12 rounded-lg bg-zinc-400 transition-all duration-300 hover:bg-primary-800 page-no prev-page">
                                <a class="flex items-center justify-center w-full cursor-pointer text-zinc-900"
                                    aria-label="angle-left" href="/[##cms.cms.link_page##]&pagenum=@page">
                                    <svg width="48" height="48" class="text-white">
                                        <use href="/images/sprite-icons.svg#icon-chevron-left-half"></use>
                                    </svg>
                                </a>
                            </li>
                        </face>
                        <face filter="(@sta='pre')and('[##cms.cms.pageurl##]'<>'')">
                            <li
                                class="group flex items-center justify-center w-12 h-12 rounded-lg bg-zinc-400 transition-all duration-300 hover:bg-primary-800 page-no prev-page">
                                <a class="flex items-center justify-center w-full cursor-pointer text-zinc-900"
                                    aria-label="angle-left" href="/[##cms.cms.pageurl##]?pagenum=@page">
                                    <svg width="48" height="48" class="text-white">
                                        <use href="/images/sprite-icons.svg#icon-chevron-left-half"></use>
                                    </svg>
                                </a>
                            </li>
                        </face>
                    </basis>
                    <basis core="print" datamembername="db.paging">
                        <face filter="(@page=[##cms.query.pagenum|(1)##])and('[##cms.cms.pageurl##]'='')">
                            <li
                                class="fflex items-center justify-center w-12 h-12 text-white font-bold rounded-lg border border-solid border-primary-800 bg-primary-800 page-no">
                                <a class="flex items-center justify-center w-full h-full cursor-pointer page-number"
                                    href="/[##cms.cms.link_page##]&pagenum=@page">
                                    @page
                                </a>
                            </li>
                        </face>
                        <face filter="(@page=[##cms.query.pagenum|(1)##])and('[##cms.cms.pageurl##]'<>'')">
                            <li
                                class="flex items-center justify-center w-12 h-12 text-white font-bold rounded-lg border border-solid border-primary-800 bg-primary-800 page-no">
                                <a class="flex items-center justify-center w-full h-full cursor-pointer page-number"
                                    href="/[##cms.cms.pageurl##]?pagenum=@page">
                                    @page
                                </a>
                            </li>
                        </face>
                        <face
                            filter="(@page<>[##cms.query.pagenum|(1)##]) and (@page>0) and (@sta='no') and ('[##cms.cms.pageurl##]'='') ">
                            <li
                                class="flex items-center justify-center w-12 h-12 text-primary-800 font-bold rounded-lg border border-solid border-primary-800 transition-all duration-300 hover:bg-primary-800 hover:text-white page-no">
                                <a class="flex items-center justify-center w-full h-full cursor-pointer page-number"
                                    href="/[##cms.cms.link_page##]&pagenum=@page">
                                    @page
                                </a>
                            </li>
                        </face>
                        <face
                            filter="(@page<>[##cms.query.pagenum|(1)##]) and (@page>0) and (@sta='no') and ('[##cms.cms.pageurl##]'<>'') ">
                            <li
                                class="flex items-center justify-center w-12 h-12 text-primary-800 font-bold rounded-lg border border-solid border-primary-800 transition-all duration-300 hover:bg-primary-800 hover:text-white page-no">
                                <a class="flex items-center justify-center w-full h-full cursor-pointer page-number"
                                    href="/[##cms.cms.pageurl##]?pagenum=@page">
                                    @page
                                </a>
                            </li>
                        </face>
                    </basis>
                    <basis core="print" datamembername="db.paging">
                        <face filter="(@sta='nex') and ('[##cms.cms.pageurl##]'='')">
                            <li
                                class="group flex items-center justify-center w-12 h-12 rounded-lg bg-zinc-400 transition-all duration-300 hover:bg-primary-800 page-no next-page">
                                <a class="flex items-center justify-center w-full h-full cursor-pointer text-zinc-900"
                                    aria-label="angle-right" href="/[##cms.cms.link_page##]&pagenum=@page">
                                    <svg width="8" height="16" class="text-white">
                                        <use href="/images/sprite-icons.svg#icon-chevron-right-half"></use>
                                    </svg>
                                </a>
                            </li>
                        </face>
                        <face filter="(@sta='nex') and ('[##cms.cms.pageurl##]'<>'')">
                            <li
                                class="group flex items-center justify-center w-12 h-12 rounded-lg bg-zinc-400 transition-all duration-300 hover:bg-primary-800 page-no next-page">

                                    </svg>
                                </a>
                            </li>
                        </face>
                    </basis>
                </ul>
            </div>
        </section>
    </main>
    <basis core="call" file="footer.inc" pageindex="[##cms.cms.pageindex##]" />

</html>
