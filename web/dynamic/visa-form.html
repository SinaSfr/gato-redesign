<basis core="dbsource" source="basiscore" lid="1" mid="20" name="db" catid="[##cms.query.catid##]">

<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0,shrink-to-fit=no,viewport-fit=cover">
    <!-- Title & Description -->
    <title>[##cms.seo.title|(خرید بلیط هواپیما - رزرو تور داخلی و خارجی - گاتو (گردشگران خورشید سپاهان))##]
    </title>
    <meta name="description"
        content="[##cms.seo.description|(خرید بلیط هواپیما، تورهای داخلی و خارجی، رزرو پرواز و هتل با بهترین قیمت در گاتو (گردشگران خورشید سپاهان). سفر آسان، امن و مقرون‌به‌صرفه با پشتیبانی ۲۴ ساعته.)##]">
    <!-- Title & Description -->
    <basis core="dbsource" source="hosting" name="tag" urlid="[##cms.seo.urlid##]">
        <member type="list" name="list" request="taglist" preview=""></member>
    </basis>
    <basis core="print" datamembername="tag.list">
        <face filter="key = 'canonical'">
            <link rel="canonical" href="@value" />
        </face>
        <face>
            <meta property="@key" content="@value" />
        </face>
    </basis>
    <!-- pwa metatags -->
    <basis core="call" file="pwa.inc" />
    <!-- common styles for all page -->
    <basis core="call" file="style.inc" />
</head>

<body>
    <basis core="call" file="header.inc" />
    <main>
        <section class="max-lg:w-[90%] max-xl:w-[97%] xl:max-w-7xl mx-auto mt-20">
            <ul itemscope itemtype="https://schema.org/BreadcrumbList" class="flex items-center text-sm gap-1">
                <li class="inline-block font-normal" itemprop="itemListElement" itemscope
                  itemtype="https://schema.org/ListItem">
                  <a class="flex items-center text-zinc-900 text-sm transition-all duration-300 hover:text-primary-800"
                    itemprop="item" href="/" aria-label="home">
                    <span itemprop="name">صفحه اصلی</span>
                    <meta itemprop="position" content="1" />
                  </a>
                </li>
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M15 6L9 12L15 18" stroke="#18181b " stroke-width="2"></path>
                </svg>
                <basis core="print" datamembername="db.navigation">
                  <face filter="RowNumber=max(RowNumber) and title <> 'ریشه'">
                    <li class="inline-block font-normal text-primary-800" itemprop="itemListElement" itemscope
                      itemtype="https://schema.org/ListItem">
                      <span itemprop="name">@title</span>
                      <meta itemprop="position" content="@rownumber" />
                    </li>
                  </face>
                  <face filter="link is null and title <> 'ریشه'">
                    <li class="flex gap-1 font-normal" itemprop="itemListElement" itemscope
                      itemtype="https://schema.org/ListItem">
                      <a class="flex items-center text-zinc-900 text-sm transition-all duration-300 hover:text-primary-800"
                        itemprop="item" href="/visa-list.bc?catid=@parentcatid" aria-label="@title">
                        <span itemprop="name">@title</span>
                        <meta itemprop="position" content="@rownumber" />
                      </a>
                      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M15 6L9 12L15 18" stroke="#18181b " stroke-width="2"></path>
                      </svg>
                    </li>
                  </face>
                  <face filter="title <> 'ریشه'">
                    <li class="flex gap-1 font-normal" itemprop="itemListElement" itemscope
                      itemtype="https://schema.org/ListItem">
                      <a class="flex items-center text-zinc-900 text-sm transition-all duration-300 hover:text-primary-800"
                        itemprop="item" href="/@link" aria-label="@title">
                        <span class="flex items-center text-zinc-900 text-sm transition-all duration-300 hover:text-primary-800"
                          itemprop="name">
                          @title
                        </span>
                        <meta itemprop="position" content="@rownumber" />
                      </a>
                      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M15 6L9 12L15 18" stroke="#18181b" stroke-width="2"></path>
                      </svg>
                    </li>
                  </face>
                </basis>
              </ul>

            <div class="relative pt-3 mt-7 mb-20">
                <div class="w-full h-[6px] bg-zinc-200 mb-20"></div>

                <div class="absolute left-0 right-0 top-0 z-20 flex mr-16">
                    <h2 class=" text-2xl font-bold bg-white px-5 text-zinc-900">ویزا های پر تقاضا</h2>
                </div>

                <div class="flex flex-col mt-6 mb-4 visa-form" id="visa-form-resize">

                    <basis core="schema" run="atclient"
                        schemaurl="/schema/domainform/70FB5B41-1038-4EED-81AE-27A67261D2E8/74F3A5C3-846F-4F65-913D-D332BE4A484A/fa/فرم-درخواست-ویزا"
                        displaymode="new" button="[data-btn-uploadVisa]" resultsourceid="upload.dataVisa"
                        OnRendered="RenderFormVisa"></basis>
                    <basis core="api" if="{##cms.uploadVisa.run|(false)##}" run="atclient"
                        url="/schema/domainform/70FB5B41-1038-4EED-81AE-27A67261D2E8/fa/editobject" method="post"
                        body="object_edit={##cms.uploadVisa.value##}&captcha={##cms.uploadVisa.captcha##}&captchaid={##cms.uploadVisa.captchaid##}"
                        content-type="application/x-www-form-urlencoded" triggers='cms.uploadVisa'
                        OnProcessed="OnProcessedEditObjectVisa"></basis>
                    <basis core="callback" run="atclient" method="uploadDocumentVisa" triggers="upload.dataVisa">
                    </basis>

                    <div class="flex items-center gap-4 captcha-button">
                        <div id="captchaContainer"
                            class="captchaContainerclass flex-[3] captcha-sefaresh ml-2.5 max-xl:ml-0 max-xl:mb-[20px]"

                            data-bc-schema-info-part="1" data-bc-schema-info-part-0-type="text">
                            <basis core="dbsource" source="trust_login" name="captcha" run="atclient"
                                triggers="captcha.refreshVisa">
                                <member name="code" type="scalar" request="captcha"></member>
                            </basis>
                            <basis datamembername="captcha.code" core="print" run="atclient">
                                <face>
                                    <script type="text/template"><div class="d-inline-block"><div class="flex gap-8">

                                    <div class="flex items-center gap-6 shrink-0">
                                        <img src="/@captcha@" loading="lazy" width="120" height="60" alt="captcha" class="w-16" />

                                    </div>
                                    
                                </div></div></script>
                                </face>
                            </basis>
                        </div>
                        <button
                            class="flex items-center justify-center w-40 h-10 text-white transition-all duration-300 bg-primary-900 rounded-xl hover:bg-secondary-500 y-2 wpx-4 data-body-btn"
                            type="button" data-btn-uploadVisa><span class="">ارسال</span></button>
                        <div
                            class="Loading_Form hidden data-body-btn w-[126px] h-12 px-4 py-2 bg-secondary-800 rounded-2xl justify-center items-center gap-2.5">
                            <div id="ballsWaveG" class="text-base font-normal leading-normal ext-zinc-50">
                                <div id="ballsWaveG_1" class="ballsWaveG"></div>
                                <div id="ballsWaveG_2" class="ballsWaveG"></div>
                                <div id="ballsWaveG_3" class="ballsWaveG"></div>
                                <div id="ballsWaveG_4" class="ballsWaveG"></div>
                                <div id="ballsWaveG_5" class="ballsWaveG"></div>
                                <div id="ballsWaveG_6" class="ballsWaveG"></div>
                                <div id="ballsWaveG_7" class="ballsWaveG"></div>
                                <div id="ballsWaveG_8" class="ballsWaveG"></div>
                            </div>
                        </div>
                    </div>
                    <div class="mt-4 text-center message-api"></div>
                </div>
            </div>
        </section>
    </main>

    <basis core="call" file="footer.inc" />
</body>

</html>
